/* ===== デザインの 仕上げ（2026年11月12日）：色・角の丸み・影・ボタン・タブ。画面の 形は かえない ===== */
:root { --ink:#1f2a24; --sub:#66716b; --line:#e2e6df; --bg:#f3f5f0; --main:#2f6f4f; --main2:#e3f1e8; --accent:#f0a83a; --shadow:0 2px 10px rgba(31,42,36,.08); --shadow2:0 8px 22px rgba(31,42,36,.14); --r:14px; }
body { font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif; background:var(--bg); background-image:radial-gradient(circle at 0 0, #ffffff 0, rgba(255,255,255,0) 45%), radial-gradient(circle at 100% 100%, #e8f2ea 0, rgba(232,242,234,0) 40%); background-attachment:fixed; -webkit-font-smoothing:antialiased; }
header { background:linear-gradient(120deg,#2a6447,#3d8862); padding:10px 20px; box-shadow:0 2px 12px rgba(0,0,0,.12); position:sticky; top:0; z-index:20; }
header > span:first-child { font-weight:bold; letter-spacing:.03em; }
header button { background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:999px; box-shadow:none; }
header button:hover { background:#fff; color:var(--main); border-color:#fff; }
header .ruto { background:rgba(255,255,255,.14); padding:2px 14px; border-radius:999px; }
main:not(.center):not(.lecture) > h2 { display:flex; align-items:center; gap:10px; font-size:1.25em; margin:24px 0 10px; }
main:not(.center):not(.lecture) > h2::before { content:''; width:6px; height:1.1em; border-radius:3px; background:var(--main); flex:none; }
